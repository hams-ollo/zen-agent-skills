<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent observatory</title>
<!--
  One page, no build step, no subresource. Every style and every line of script is inline and
  nothing outside this file is requested, so the page renders with the network unavailable.
  That is a contract property, not a preference: docs/spec/agent-observatory.md S-022 says no
  data leaves the machine, and a remote font or a chart library would fetch on every load.

  Charts are hand-rolled inline SVG for the same reason.

  The shell is the deliverable here. feat-0055 to feat-0058 add their reports by serving a JSON
  endpoint and adding one function to RENDERERS below; none of them should need to touch the
  layout, the navigation, or the scope selector.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6a6a63;
    --rule: #e2e2dc;
    --accent: #3f6f5e;
    --accent-soft: #cfe0d8;
    --zero: #b9b9b1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --panel: #1d1f23;
      --ink: #e9e9e4;
      --muted: #9b9b93;
      --rule: #2c2f34;
      --accent: #7fbfa5;
      --accent-soft: #2f4a41;
      --zero: #4a4d52;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
    padding: 18px 24px 12px; border-bottom: 1px solid var(--rule);
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: 0.02em; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  .grow { flex: 1 1 auto; }
  .controls { display: flex; gap: 8px; align-items: center; flex: 0 0 auto; }
  .controls select { flex: 0 1 auto; max-width: 280px; }
  .controls button {
    font: inherit; padding: 4px 10px; border-radius: 5px; border: 1px solid var(--rule);
    background: var(--panel); color: var(--ink); cursor: pointer;
  }
  .scroller { overflow-x: auto; }
  .muted { color: var(--muted); font-size: 13px; }
  code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
  select {
    font: inherit; padding: 4px 8px; border: 1px solid var(--rule);
    border-radius: 5px; background: var(--panel); color: var(--ink);
  }
  nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 24px; }
  nav button {
    font: inherit; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 999px;
    background: var(--panel); color: var(--ink); cursor: pointer;
  }
  nav button[aria-current="true"] {
    background: var(--accent-soft); border-color: var(--accent); color: var(--ink);
  }
  nav button[data-built="false"] { color: var(--muted); }
  main { padding: 8px 24px 40px; }
  .panel {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
    padding: 18px 20px; margin-bottom: 16px;
  }
  .figures { display: flex; flex-wrap: wrap; gap: 26px; margin: 14px 0 4px; }
  .figure strong { display: block; font-size: 22px; font-weight: 600; }
  .figure span { color: var(--muted); font-size: 12px; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  th, td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--rule); }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr[data-unused="true"] td { color: var(--muted); }
  tr[data-memo="true"] td { color: var(--muted); }
  /* An unpriced row is not greyed out. It carries a real token figure and an unknown cost,
     and muting it would make the one row a reader must not skim past look like the skippable
     kind. See S-011. */
  tr[data-priced="false"] td .tag {
    border-color: var(--accent); color: var(--ink);
  }
  tr[data-state="ended"] td { color: var(--muted); }
  tr[data-state="running"] td .tag {
    background: var(--accent-soft); border-color: var(--accent); color: var(--ink);
  }
  td .why { color: var(--muted); font-size: 11px; margin-top: 2px; max-width: 34em; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .acts a, .acts button {
    font: inherit; font-size: 12px; padding: 2px 8px; border-radius: 5px;
    border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
    cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .acts code { font-size: 11px; color: var(--muted); word-break: break-all; }
  .tag {
    font-size: 11px; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--rule); color: var(--muted);
  }
  .chart { width: 100%; height: auto; display: block; margin-top: 8px; }
  /* Fixed rather than fluid: a per-row timeline inside a table cell shrinks to whatever the
     other columns leave it, and at 60 pixels wide it stops meaning anything. */
  .strip { width: 240px; min-width: 240px; height: auto; display: block; }
  footer { padding: 0 24px 30px; }
</style>
</head>
<body>
<header>
  <h1>Agent observatory</h1>
  <div class="grow"></div>
  <div class="controls">
    <label class="muted" for="scope">Scope</label>
    <select id="scope"><option value="">Every project</option></select>
    <button id="refresh" type="button">Refresh</button>
  </div>
</header>

<nav id="nav"></nav>

<main>
  <div id="report" class="panel"><p class="muted">Loading.</p></div>
</main>

<footer>
  <p class="muted" id="footnote"></p>
</footer>

<script>
"use strict";

var STATE = { reports: [], current: "", project: "", store: "", roster: "", actions: [],
              live: false, pollSeconds: null };

function el(tag, attrs, children) {
  var node = document.createElement(tag);
  attrs = attrs || {};
  for (var key in attrs) {
    if (key === "text") { node.textContent = attrs[key]; }
    else { node.setAttribute(key, attrs[key]); }
  }
  (children || []).forEach(function (child) { node.appendChild(child); });
  return node;
}

function svg(tag, attrs) {
  var node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (var key in attrs) { node.setAttribute(key, attrs[key]); }
  return node;
}

function get(path) {
  return fetch(path, { cache: "no-store" }).then(function (response) {
    return response.json();
  });
}

function scoped(path) {
  return STATE.project ? path + "?project=" + encodeURIComponent(STATE.project) : path;
}

/* One hand-rolled horizontal bar chart. No chart library, and none is wanted: this is the
   whole of what the five reports need from a chart, and a dependency here would also have to
   be fetched, which S-022 forbids. */
function barChart(rows, labelKey, valueKey) {
  var shown = rows.slice(0, 20);
  var rowHeight = 22, labelWidth = 190, pad = 8;
  var width = 720;
  var height = shown.length * rowHeight + pad * 2;
  var max = 0;
  shown.forEach(function (row) { max = Math.max(max, row[valueKey]); });
  var scale = max > 0 ? (width - labelWidth - 60) / max : 0;

  var chart = svg("svg", {
    "class": "chart", viewBox: "0 0 " + width + " " + height,
    role: "img", "aria-label": "Skill use counts"
  });
  shown.forEach(function (row, index) {
    var y = pad + index * rowHeight;
    var value = row[valueKey];
    var label = svg("text", {
      x: labelWidth - 8, y: y + 14, "text-anchor": "end",
      "font-size": "12", fill: "currentColor",
      "fill-opacity": value ? "0.95" : "0.5"
    });
    label.textContent = row[labelKey];
    chart.appendChild(label);

    var barWidth = Math.max(value * scale, value > 0 ? 2 : 0);
    chart.appendChild(svg("rect", {
      x: labelWidth, y: y + 4, width: barWidth, height: rowHeight - 10, rx: "2",
      fill: value ? "var(--accent)" : "var(--zero)"
    }));
    var count = svg("text", {
      x: labelWidth + barWidth + 6, y: y + 14, "font-size": "12",
      fill: "currentColor", "fill-opacity": value ? "0.8" : "0.45"
    });
    count.textContent = value;
    chart.appendChild(count);
  });
  return chart;
}

/* Number formatting, in one place so the cost report cannot show a figure one way in the
   headline and another in the table. usd() is deliberately not currency-aware: the rate table
   states its own currency and the page prints that, rather than assuming dollars. */
function group(value) {
  return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function usd(value) {
  return value === null || value === undefined ? "unknown" : value.toFixed(2);
}

function pct(share) {
  return share === null || share === undefined ? "unknown" : (share * 100).toFixed(1) + "%";
}

/* The context-budget series as one hand-rolled inline SVG: a line of the lowest remaining
   context seen each day, with a tick on every day a session was compacted. No chart library,
   for the same reason the bar chart has none.

   Compactions are drawn on the same axis rather than listed only in the table below, because
   S-017 asks for the occasions to be identifiable and a compaction is precisely the thing that
   explains a line jumping back up. */
function pressureChart(daily, compactions) {
  if (!daily || daily.length < 2) { return null; }
  var width = 720, height = 180, padLeft = 70, padRight = 12, padTop = 14, padBottom = 26;
  var plotWidth = width - padLeft - padRight, plotHeight = height - padTop - padBottom;
  var max = 0;
  daily.forEach(function (row) { max = Math.max(max, row.max_tokens_left); });
  if (max <= 0) { return null; }

  var index = {};
  daily.forEach(function (row, i) { index[row.day] = i; });
  var step = daily.length > 1 ? plotWidth / (daily.length - 1) : 0;
  function x(i) { return padLeft + i * step; }
  function y(value) { return padTop + plotHeight - (value / max) * plotHeight; }

  var chart = svg("svg", {
    "class": "chart", viewBox: "0 0 " + width + " " + height, role: "img",
    "aria-label": "Lowest remaining context per day, with compaction occasions marked"
  });
  chart.appendChild(svg("line", {
    x1: padLeft, y1: padTop + plotHeight, x2: width - padRight, y2: padTop + plotHeight,
    stroke: "currentColor", "stroke-opacity": "0.25"
  }));

  /* Every day a compaction happened, behind the line rather than over it. */
  var marked = {};
  (compactions || []).forEach(function (event) {
    var day = (event.ts || "").slice(0, 10);
    if (!(day in index) || marked[day]) { return; }
    marked[day] = true;
    chart.appendChild(svg("line", {
      x1: x(index[day]), y1: padTop, x2: x(index[day]), y2: padTop + plotHeight,
      stroke: "var(--accent)", "stroke-opacity": "0.55", "stroke-dasharray": "3 3"
    }));
  });

  var points = daily.map(function (row, i) {
    return x(i).toFixed(1) + "," + y(row.min_tokens_left).toFixed(1);
  }).join(" ");
  chart.appendChild(svg("polyline", {
    points: points, fill: "none", stroke: "var(--accent)", "stroke-width": "2"
  }));

  [[max, padTop + 4], [0, padTop + plotHeight]].forEach(function (pair) {
    var tick = svg("text", { x: padLeft - 8, y: pair[1], "text-anchor": "end",
                             "font-size": "11", fill: "currentColor",
                             "fill-opacity": "0.6" });
    tick.textContent = group(pair[0]);
    chart.appendChild(tick);
  });
  [[daily[0].day, padLeft, "start"],
   [daily[daily.length - 1].day, width - padRight, "end"]].forEach(function (pair) {
    var stamp = svg("text", { x: pair[1], y: height - 8, "text-anchor": pair[2],
                              "font-size": "11", fill: "currentColor",
                              "fill-opacity": "0.6" });
    stamp.textContent = pair[0];
    chart.appendChild(stamp);
  });
  return chart;
}

/* Every interactive element this surface offers against a session is built here and nowhere
   else, and every one carries data-action naming its entry in the server's ACTIONS registry.
   S-019 is an enumeration claim, so the enumeration has to be derivable rather than
   maintained by hand: one construction site plus one tag is what makes it derivable. A
   renderer that builds its own button is caught by the test, not by a reviewer remembering.

   Both kinds are non-mutating by construction. A navigate action is an anchor the viewer
   follows; a copy-command puts text on their clipboard for them to run. Neither can reach a
   session, and there is no third kind. */
function actionControl(action, row) {
  var value = row[action.field];
  if (!value) { return null; }

  if (action.kind === "navigate") {
    /* noreferrer keeps the loopback URL from reaching the destination. The report itself
       still requests nothing: this is a link the viewer chooses to follow. */
    return el("a", {
      "data-action": action.id, href: value, target: "_blank",
      rel: "noreferrer noopener", text: action.label, title: action.note
    });
  }

  var text = action.template.replace("{" + action.field + "}", value);
  if (!(navigator.clipboard && navigator.clipboard.writeText)) {
    /* No clipboard API, so present the command as selectable text instead of a button that
       would do nothing. S-019 asks that the command reach a person, not that a button exist. */
    return el("code", { "data-action": action.id, text: text, title: action.note });
  }
  var button = el("button", {
    "data-action": action.id, type: "button", text: action.label, title: text
  });
  button.addEventListener("click", function () {
    navigator.clipboard.writeText(text).then(function () {
      button.textContent = "Copied";
      setTimeout(function () { button.textContent = action.label; }, 1200);
    }, function () {
      button.textContent = "Copy failed";
      setTimeout(function () { button.textContent = action.label; }, 1200);
    });
  });
  return button;
}

function actionCell(row) {
  var cell = el("td", {}, [el("div", { "class": "acts" })]);
  var holder = cell.firstChild;
  STATE.actions.forEach(function (action) {
    var control = actionControl(action, row);
    if (control) { holder.appendChild(control); }
  });
  return cell;
}

function figure(value, caption) {
  return el("div", { "class": "figure" }, [
    el("strong", { text: String(value) }), el("span", { text: caption })
  ]);
}

/* Milliseconds are what the store holds and what nobody reads at a glance. Unknown stays the
   word "unknown" rather than becoming 0s, which would be a duration nobody measured. */
function duration(millis) {
  if (millis === null || millis === undefined) { return "unknown"; }
  var seconds = Math.round(millis / 1000);
  if (seconds < 60) { return seconds + "s"; }
  var minutes = Math.floor(seconds / 60);
  if (minutes < 60) { return minutes + "m " + (seconds % 60) + "s"; }
  return Math.floor(minutes / 60) + "h " + (minutes % 60) + "m";
}

/* A figure and where it came from, never one without the other. An exact figure the harness
   reported and one derived from the agent's own messages must not share a column in silence:
   the second is close and not exact, and a reader shown only the number cannot tell. */
function withBasis(text, basis) {
  if (basis === "unknown") { return "unknown"; }
  return text + (basis === "reported" ? "" : " ~");
}

/* A wave's total carries one thing a run's figure does not: it can be assembled from some of
   its members rather than all of them. A sum over three of five members is not the wave's
   cost, and rendered bare it is indistinguishable from one that is, so the count travels
   with the figure whenever the two disagree. */
function waveTotal(value, basis, known, size) {
  if (value === null) { return "unknown"; }
  var shown = withBasis(String(value), basis);
  return known < size ? shown + " (" + known + " of " + size + ")" : shown;
}

/* A corpus timestamp, trimmed to what a reader uses. Trimming rather than reformatting, so
   the page does no date arithmetic of its own and cannot invent a time zone. */
function shortTime(ts) {
  if (!ts) { return "not recorded"; }
  return String(ts).replace("T", " ").slice(0, 19);
}

/* One wave's members on a shared timeline. Hand-rolled inline SVG, because a chart library
   would be a dependency and a fetch, and S-022 forbids the second.

   The arithmetic is the server's. Every member carries `bar`, the offset and width the server
   computed as fractions of its wave's span, so this multiplies by a pixel width and does no
   date maths at all. That is deliberate: the page's script has no execution coverage here, and
   sums nothing can run are sums nobody can check. */
function waveStrip(wave) {
  var rowHeight = 10, pad = 4, width = 240;
  var height = wave.members.length * rowHeight + pad * 2;
  var chart = svg("svg", {
    "class": "strip", viewBox: "0 0 " + width + " " + height,
    role: "img",
    "aria-label": "When each of this wave's " + wave.members.length
                + " agents was active, across the wave's own span"
  });
  wave.members.forEach(function (member, index) {
    var y = pad + index * rowHeight;
    if (!member.bar) {
      /* No start time, so no position. A hollow tick at the left says the member exists and
         claims no place on the timeline, which is different from a zero-length bar. */
      chart.appendChild(svg("rect", {
        x: 0, y: y + 1, width: 2, height: rowHeight - 3,
        fill: "none", stroke: "var(--zero)", "stroke-width": "1"
      }));
      return;
    }
    chart.appendChild(svg("rect", {
      x: member.bar.offset * width, y: y + 1,
      width: Math.max(member.bar.width * width, 2), height: rowHeight - 3, rx: "2",
      fill: member.worktree_path ? "var(--accent)" : "var(--zero)"
    }));
  });
  return chart;
}

/* Each report adds one function here, keyed by its id in the server's REPORTS registry.
   A report with no renderer falls back to the owed panel below, so the shell never shows an
   empty box without saying which task owes it. */
var RENDERERS = {
  fleet: function (data, into) {
    if (data.store_present === false) {
      into.appendChild(el("p", { text: data.message }));
      return;
    }
    into.appendChild(el("h2", { text: "Fleet" }));
    into.appendChild(el("p", {
      "class": "muted",
      /* Derived from the same state the footnote uses, so the two cannot disagree again.
         This sentence said "not live: press Refresh to ask again" while the footer said
         the page was following the corpus, and both were on screen at once. */
      text: "Which sessions exist, where, and which are running. "
          + (STATE.live
              ? "Following the corpus: new work appears here on its own."
              : "Correct as of when this report was requested. Press Refresh to ask again.")
    }));

    var totals = data.totals;
    var figures = [
      figure(totals.sessions, "sessions"),
      figure(totals.running, "running now"),
      figure(totals.ended, "ended"),
      figure(totals.unverified, "unverified")
    ];
    /* Shown only when there is one, because a row of zeroes trains a reader to skip the
       line, and these two are exactly the lines that must not be skipped. */
    if (totals.stale_entries) {
      figures.push(figure(totals.stale_entries, "stale registry entries"));
    }
    if (totals.not_yet_ingested) {
      figures.push(figure(totals.not_yet_ingested, "live, not yet ingested"));
    }
    into.appendChild(el("div", { "class": "figures" }, figures));

    into.appendChild(el("p", { "class": "muted", text: data.liveness_policy }));
    into.appendChild(el("p", {
      "class": "muted",
      text: "Checked by " + data.liveness_check + ". Registry: " + data.registry.path
          + (data.registry.present
              ? ", " + data.registry.entries + " entries"
              : ", absent, so every session here reads as ended")
          + (data.registry.unreadable
              ? ", " + data.registry.unreadable + " unreadable" : "")
          + ". A session attributed to no project is counted under "
          + data.unattributed_label + " rather than dropped, so the per-project figures "
          + "still add up to the totals above."
    }));

    into.appendChild(el("h2", { text: "By project" }));
    into.appendChild(el("table", {}, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "Project" }), el("th", { text: "Sessions" }),
        el("th", { text: "Running" }), el("th", { text: "Unverified" }),
        el("th", { text: "Ended" })
      ])]),
      el("tbody", {}, data.projects.map(function (row) {
        return el("tr", {}, [
          el("td", { text: row.project }),
          el("td", { "class": "n", text: String(row.sessions) }),
          el("td", { "class": "n", text: String(row.running) }),
          el("td", { "class": "n", text: String(row.unverified) }),
          el("td", { "class": "n", text: String(row.ended) })
        ]);
      }))
    ]));

    into.appendChild(el("h2", { text: "Sessions" }));
    /* The surface stating its own boundary. S-019 is answered by enumerating what is offered,
       so the enumeration is shown rather than left for a reader to infer from the buttons. */
    into.appendChild(el("p", {
      "class": "muted",
      text: "Everything this surface can do to a session, in full: "
          + STATE.actions.map(function (action) {
              return action.label + " (" + action.kind + ")";
            }).join(", ")
          + ". None of them changes a session. Starting, resuming, interrupting, and ending "
          + "one are the contract's Non-Goals, so a command is presented for you to run "
          + "rather than run for you."
    }));
    var scroller = el("div", { "class": "scroller" });
    scroller.appendChild(el("table", {}, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "State" }), el("th", { text: "Project" }),
        el("th", { text: "Branch" }), el("th", { text: "Last activity" }),
        el("th", { text: "Session" }), el("th", { text: "Where" }),
        el("th", { text: "Actions" })
      ])]),
      el("tbody", {}, data.sessions.map(function (row) {
        var state = el("td", {}, [el("span", { "class": "tag", text: row.state })]);
        /* A stale or unverifiable entry carries its reason on the row. Putting it in a
           tooltip would hide the one thing this report must not state without qualifying. */
        if (row.registry === "stale" || row.registry === "unchecked") {
          state.appendChild(el("div", { "class": "why", text: row.evidence }));
        }
        return el("tr", { "data-state": row.state }, [
          state,
          el("td", { text: row.project }),
          el("td", { text: row.branch || "not recorded yet" }),
          el("td", { text: row.last_activity || "not ingested yet" }),
          el("td", { text: row.title || row.name || row.session_id }),
          el("td", { text: (row.entrypoint || "") + (row.pid ? " pid " + row.pid : "") }),
          actionCell(row)
        ]);
      }))
    ]));
    into.appendChild(scroller);
  },

  skills: function (data, into) {
    if (data.store_present === false) {
      into.appendChild(el("p", { text: data.message }));
      return;
    }
    into.appendChild(el("h2", { text: "Skills" }));
    into.appendChild(el("p", {
      "class": "muted",
      text: "Which skills are used, how often, and which never are. A use is one message "
          + "carrying that skill's attribution, counted once even where a forked session "
          + "replays it."
    }));
    into.appendChild(el("div", { "class": "figures" }, [
      figure(data.total_uses, "attributed messages"),
      figure(data.installed_used, "installed skills used"),
      figure(data.installed_unused, "installed skills never used"),
      figure(data.roster_size, "skills in the roster")
    ]));
    into.appendChild(el("p", {
      "class": "muted",
      text: "Never-used is counted against " + data.roster_label + "."
    }));
    var scroller = el("div", { "class": "scroller" });
    scroller.appendChild(barChart(data.skills, "skill", "uses"));
    into.appendChild(scroller);

    var body = el("tbody", {}, data.skills.map(function (row) {
      return el("tr", { "data-unused": String(row.uses === 0) }, [

  cost: function (data, into) {
    if (data.store_present === false) {
      into.appendChild(el("p", { text: data.message }));
      return;
    }
    var rates = data.rates, cost = data.cost, tokens = data.tokens, cache = data.cache;
    var context = data.pressure.context, quota = data.pressure.quota;
    /* S-010's Then, in the one place it has to hold: the date the rates were recorded travels
       with the figure itself, in its caption, rather than sitting in a footnote a reader can
       skip. A stale table misstates every cost here while the page looks exactly as correct as
       the day the rates were right. */
    var dated = rates.as_of ? "estimated, rates of " + rates.as_of
                            : "estimated, rates undated";

    into.appendChild(el("h2", { text: "Cost and pressure" }));
    into.appendChild(el("p", {
      "class": "muted",
      text: "What was consumed, and how close to a limit."
    }));
    into.appendChild(el("p", { text: data.estimate_label }));

    into.appendChild(el("div", { "class": "figures" }, [
      figure((rates.currency || "") + " " + usd(cost.estimated_usd), dated),
      figure(group(tokens.total), "tokens"),
      figure(pct(cache.served_share), "served from cache"),
      figure(group(tokens.messages), "messages")
    ]));

    /* Not muted when the total is incomplete. S-011 requires a total covering unpriced
       sessions to say so, and a grey line under a big number is not saying so. */
    into.appendChild(el("p", { "class": cost.complete ? "muted" : "", text: cost.note }));
    into.appendChild(el("p", { "class": "muted", text: data.unpriced_policy }));
    into.appendChild(el("p", { "class": "muted", text: data.historical_note }));
    into.appendChild(el("p", {
      "class": "muted",
      text: rates.note + " Source: " + (rates.source || "none recorded")
          + " It is read from disk on every request and is never fetched."
    }));

    /* A rate can be correct and temporary at the same time, and the number cannot say so.
       Not muted, and above the tables rather than under them: a reader who is about to
       compare per-model costs needs to know which of those rates has a date on it before
       they read the column, not after. */
    if (rates.rate_notes && rates.rate_notes.length) {
      into.appendChild(el("h2", { text: "Rates with a limited life" }));
      into.appendChild(el("table", {}, [
        el("thead", {}, [el("tr", {}, [
          el("th", { text: "Model" }), el("th", { text: "In force until" }),
          el("th", { text: "What it is" })
        ])]),
        el("tbody", {}, rates.rate_notes.map(function (entry) {
          return el("tr", {}, [
            el("td", {}, [el("code", { text: entry.model })]),
            el("td", { text: entry.expires || "no date recorded" }),
            el("td", { text: entry.note })
          ]);
        }))
      ]));
    }

    into.appendChild(el("h2", { text: "Tokens by kind" }));
    var kinds = [["Input", tokens.input], ["Output", tokens.output],
                 ["Cache read", tokens.cache_read],
                 ["Cache creation", tokens.cache_creation]];
    into.appendChild(el("table", {}, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "Kind" }), el("th", { text: "Tokens" }),
        el("th", { text: "Share of total" })
      ])]),
      el("tbody", {}, kinds.map(function (pair) {
        return el("tr", {}, [
          el("td", { text: pair[0] }),
          el("td", { "class": "n", text: group(pair[1]) }),
          el("td", { "class": "n",
                     text: tokens.total ? pct(pair[1] / tokens.total) : "unknown" })
        ]);
      }).concat([
        el("tr", { "data-memo": "true" }, [
          el("td", { text: "of which thinking" }),
          el("td", { "class": "n", text: group(tokens.thinking_within_output) }),
          el("td", { text: "already inside output, so never priced a second time" })
        ])
      ]))
    ]));
    into.appendChild(el("p", {
      "class": "muted",
      text: "Served from cache: " + pct(cache.served_share) + " of "
          + group(cache.input_side_tokens) + " input-side tokens. The basis is "
          + cache.basis
    }));

    into.appendChild(el("h2", { text: "By model" }));
    var models = el("div", { "class": "scroller" });
    models.appendChild(el("table", {}, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "Model" }), el("th", { text: "Messages" }),
        el("th", { text: "Input" }), el("th", { text: "Output" }),
        el("th", { text: "Cache read" }), el("th", { text: "Cache creation" }),
        el("th", { text: "Estimated cost" })
      ])]),
      el("tbody", {}, data.models.map(function (row) {
        /* An unpriced model shows the word, never a number. A blank cell or a zero here is
           the whole of what S-011 forbids. */
        var money = row.priced
          ? el("td", { "class": "n", text: usd(row.cost_usd) })
          : el("td", {}, [el("span", { "class": "tag",
                                       text: "unpriced: unknown, not zero" })]);
        return el("tr", { "data-priced": String(row.priced) }, [
          el("td", { text: row.model }),
          el("td", { "class": "n", text: group(row.messages) }),
          el("td", { "class": "n", text: group(row.input_tokens) }),
          el("td", { "class": "n", text: group(row.output_tokens) }),
          el("td", { "class": "n", text: group(row.cache_read_tokens) }),
          el("td", { "class": "n", text: group(row.cache_creation_tokens) }),
          money
        ]);
      }))
    ]));
    into.appendChild(models);

    into.appendChild(el("h2", { text: "Context pressure" }));
    if (!context.available) {
      into.appendChild(el("p", { "class": "muted", text: context.reason }));
    } else {
      into.appendChild(el("div", { "class": "figures" }, [
        figure(group(context.samples), "context readings"),
        figure(group(context.sessions), "sessions with readings"),
        figure(group(context.compaction_count), "compactions"),
        figure(context.lowest.length ? group(context.lowest[0].tokens_left) : "none",
               "lowest context left")
      ]));
      into.appendChild(el("p", {
        "class": "muted",
        text: "The series is " + context.source
            + ". The line is the lowest remaining context seen on each day; a dashed tick "
            + "marks a day on which a session was compacted."
      }));
      var chart = pressureChart(context.daily, context.compactions);
      if (chart) {
        var holder = el("div", { "class": "scroller" });
        holder.appendChild(chart);
        into.appendChild(holder);
      }
      into.appendChild(el("table", {}, [
        el("thead", {}, [el("tr", {}, [
          el("th", { text: "Day" }), el("th", { text: "Readings" }),
          el("th", { text: "Lowest left" }), el("th", { text: "Highest left" })
        ])]),
        el("tbody", {}, context.daily.map(function (row) {
          return el("tr", {}, [
            el("td", { text: row.day }),
            el("td", { "class": "n", text: group(row.samples) }),
            el("td", { "class": "n", text: group(row.min_tokens_left) }),
            el("td", { "class": "n", text: group(row.max_tokens_left) })
          ]);
        }))
      ]));
      into.appendChild(el("h2", { text: "Compaction occasions" }));
      if (!context.compactions.length) {
        into.appendChild(el("p", {
          "class": "muted",
          text: "None in scope. A compaction is recorded by a compact_boundary record, and "
              + "the corpus carries no other marker for one."
        }));
      } else {
        into.appendChild(el("table", {}, [
          el("thead", {}, [el("tr", {}, [
            el("th", { text: "When" }), el("th", { text: "Session" })
          ])]),
          el("tbody", {}, context.compactions.map(function (row) {
            return el("tr", {}, [
              el("td", { text: row.ts }),
              el("td", {}, [el("code", { text: row.session_id })])
            ]);
          }))
        ]));
      }
    }

    into.appendChild(el("h2", { text: "Quota pressure" }));
    if (!quota.available) {
      /* Not an error, and not silence either. The contract marks this source optional, so its
         absence degrades S-017 to its context half and the page says which half it is
         showing. */
      into.appendChild(el("p", { text: quota.reason }));
      into.appendChild(el("p", { "class": "muted", text: quota.provenance }));
      into.appendChild(el("p", { "class": "muted",
                                 text: "Expected format: " + quota.format }));
    } else {
      into.appendChild(el("p", { "class": "muted", text: quota.reason }));
      into.appendChild(el("table", {}, [
        el("thead", {}, [el("tr", {}, [
          el("th", { text: "Window" }), el("th", { text: "Samples" }),
          el("th", { text: "First" }), el("th", { text: "Latest" }),
          el("th", { text: "Latest used" }), el("th", { text: "Peak used" })
        ])]),
        el("tbody", {}, quota.windows.map(function (row) {
          return el("tr", {}, [
            el("td", { text: row.window }),
            el("td", { "class": "n", text: group(row.samples) }),
            el("td", { text: row.first_ts }),
            el("td", { text: row.last_ts }),
            el("td", { "class": "n", text: row.latest_used_percent + "%" }),
            el("td", { "class": "n", text: row.peak_used_percent + "%" })
          ]);
        }))
      ]));
      if (quota.unreadable) {
        into.appendChild(el("p", {
          "class": "muted",
          text: quota.unreadable + " line(s) in the quota series could not be read and are "
              + "reported rather than dropped silently."
        }));
      }
    }
  },

  health: function (data, into) {
    if (data.store_present === false) {
      into.appendChild(el("p", { text: data.message }));
      return;
    }
    into.appendChild(el("h2", { text: "Health" }));
    into.appendChild(el("p", {
      "class": "muted",
      text: "What failed, and how often. A hook that failed, with the status it exited on; "
          + "an API error, with the number of attempts the request took; and a run the "
          + "corpus marks as having ended abnormally."
    }));

    var totals = data.totals;
    into.appendChild(el("div", { "class": "figures" }, [
      figure(totals.hook_failures, "hook failures"),
      figure(totals.api_errors, "API errors"),
      figure(totals.worst_attempts, "most attempts one request took"),
      figure(totals.abnormal_runs, "runs that ended abnormally"),
      figure(totals.sessions_affected, "sessions with a health record")
    ]));

    /* The qualification sits with the figures rather than under them. A clean health report
       is the one result a reader is most likely to over-read, so what it does not cover is
       stated where they meet the number and not in a footnote they may not reach. */
    into.appendChild(el("p", { "class": "muted", text: data.blind_spot }));
    into.appendChild(el("p", {
      "class": "muted",
      text: data.replay_policy + " Here that is " + totals.events + " events written as "
          + totals.records + " records."
    }));

    /* An empty report says so. A panel with four zeroes and no tables is indistinguishable
       from a panel that failed to load, and the difference is the whole of what this report
       would be telling a reader on a corpus where nothing went wrong. */
    if (data.empty) {
      into.appendChild(el("p", {
        text: "Nothing failed in what this report can see: no hook failure, no API error, "
            + "and no run marked as having ended abnormally, over " + totals.events
            + " health events in scope. That is an empty result rather than an absent one, "
            + "and the sentence above says what it does not cover."
      }));
    }

    into.appendChild(el("h2", { text: "Hook failures" }));
    if (!data.hook_failures.length) {
      into.appendChild(el("p", { "class": "muted",
        text: "None recorded, out of " + totals.hook_events + " hook events in scope." }));
    } else {
      var hooks = el("div", { "class": "scroller" });
      hooks.appendChild(el("table", {}, [
        el("thead", {}, [el("tr", {}, [
          el("th", { text: "When" }), el("th", { text: "Project" }),
          el("th", { text: "Session" }), el("th", { text: "Hook" }),
          el("th", { text: "Event" }), el("th", { text: "Exit" }),
          el("th", { text: "What it reported" })
        ])]),
        el("tbody", {}, data.hook_failures.map(function (row) {
          var what = el("td", { text: row.command || "" });
          if (row.detail) {
            what.appendChild(el("div", { "class": "why", text: row.detail }));
          }
          if (row.replays) {
            what.appendChild(el("div", { "class": "why",
              text: "Also written into " + row.replays + " replayed transcript(s), and "
                  + "counted once." }));
          }
          return el("tr", {}, [
            el("td", { text: row.ts || "not recorded" }),
            el("td", { text: row.project }),
            el("td", { text: row.session_title || row.session_id }),
            el("td", { text: row.hook_name || "not recorded" }),
            el("td", { text: row.hook_event || "not recorded" }),
            el("td", { "class": "n",
                       text: row.exit_code === null ? "not recorded"
                                                    : String(row.exit_code) }),
            what
          ]);
        }))
      ]));
      into.appendChild(hooks);
    }

    into.appendChild(el("h2", { text: "API errors and their retries" }));
    if (!data.retry_episodes.length) {
      into.appendChild(el("p", { "class": "muted", text: "None recorded." }));
    } else {
      into.appendChild(el("p", {
        "class": "muted",
        text: "One row per request that erred, however many times it was retried. The "
            + "attempts column is what the request cost, not whether it eventually "
            + "succeeded: the corpus records the retries and not the verdict."
      }));
      var retries = el("div", { "class": "scroller" });
      retries.appendChild(el("table", {}, [
        el("thead", {}, [el("tr", {}, [
          el("th", { text: "First attempt" }), el("th", { text: "Last attempt" }),
          el("th", { text: "Project" }), el("th", { text: "Session" }),
          el("th", { text: "Attempts" }), el("th", { text: "What it reported" })
        ])]),
        el("tbody", {}, data.retry_episodes.map(function (row) {
          var what = el("td", {});
          what.appendChild(el("div", { "class": "why", text: row.detail || "not recorded" }));
          return el("tr", {}, [
            el("td", { text: row.first_ts || "not recorded" }),
            el("td", { text: row.last_ts || "not recorded" }),
            el("td", { text: row.project }),
            el("td", { text: row.session_title || row.session_id }),
            el("td", { "class": "n", text: String(row.attempts) }),
            what
          ]);
        }))
      ]));
      into.appendChild(retries);
    }

    into.appendChild(el("h2", { text: "Runs that ended abnormally" }));
    if (!data.abnormal_runs.length) {
      into.appendChild(el("p", { "class": "muted", text: "None recorded." }));
    } else {
      var abnormal = el("div", { "class": "scroller" });
      abnormal.appendChild(el("table", {}, [
        el("thead", {}, [el("tr", {}, [
          el("th", { text: "When" }), el("th", { text: "Project" }),
          el("th", { text: "Session" }), el("th", { text: "Ended" }),
          el("th", { text: "Status" }), el("th", { text: "Model" }),
          el("th", { text: "What it reported" })
        ])]),
        el("tbody", {}, data.abnormal_runs.map(function (row) {
          return el("tr", {}, [
            el("td", { text: row.ts || "not recorded" }),
            el("td", { text: row.project }),
            el("td", { text: row.session_title || row.session_id }),
            el("td", { text: row.markers.join(" and ") }),
            el("td", { text: row.status || "not recorded" }),
            el("td", { text: row.model || "not recorded" }),
            el("td", {}, [el("div", { "class": "why",
                                      text: row.detail || "not recorded" })])
          ]);
        }))
      ]));
      into.appendChild(abnormal);
    }

    /* Every kind of health record in scope, including the ones this report does not treat as
       a failure. Filtering them out here would leave a reader unable to tell a kind that
       counted nothing from a kind that was never looked at, and one of them is a recorded
       bound rather than an absence. */
    into.appendChild(el("h2", { text: "What was read, and what it counted for" }));
    into.appendChild(el("table", {}, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "Kind" }), el("th", { text: "Events" }),
        el("th", { text: "Records" }), el("th", { text: "What this report does with it" })
      ])]),
      el("tbody", {}, data.kinds.map(function (row) {
        return el("tr", { "data-unused": String(row.events === 0) }, [
          el("td", { text: row.kind }),
          el("td", { "class": "n", text: String(row.events) }),
          el("td", { "class": "n", text: String(row.records) }),
          el("td", { text: row.role })
        ]);
      }))
    ]));
  }
};

function owedPanel(report, into) {
  into.appendChild(el("h2", { text: report.title }));
  into.appendChild(el("p", { "class": "muted", text: report.question }));
  into.appendChild(el("p", {
    text: "Not built yet. Owned by " + report.owner + ", covering "
        + report.scenarios.join(", ") + "."
  }));
}

function renderNav() {
  var nav = document.getElementById("nav");
  nav.textContent = "";
  STATE.reports.forEach(function (report) {
    var built = Boolean(report.endpoint);
    var button = el("button", {
      type: "button", "data-report": report.id, "data-built": String(built),
      "aria-current": String(report.id === STATE.current), text: report.title
    });
    button.addEventListener("click", function () {
      STATE.current = report.id;
      renderNav();
      renderReport();
    });
    nav.appendChild(button);
  });
}

function renderReport() {
  var into = document.getElementById("report");
  into.textContent = "";
  var report = STATE.reports.filter(function (r) { return r.id === STATE.current; })[0];
  if (!report) { return; }
  if (!report.endpoint || !RENDERERS[report.id]) {
    owedPanel(report, into);
    return;
  }
  into.appendChild(el("p", { "class": "muted", text: "Loading." }));
  get(scoped(report.endpoint)).then(function (data) {
    into.textContent = "";
    if (data.error) { into.appendChild(el("p", { text: data.error })); return; }
    RENDERERS[report.id](data, into);
  }).catch(function (err) {
    into.textContent = "";
    into.appendChild(el("p", { text: "Could not load the report: " + err }));
  });
}

/* The live channel. EventSource is built into the browser and text/event-stream is a
   handful of bytes on the wire, so S-013 costs no library here and none on the server.

   A browser without EventSource, or a server that refuses the route, leaves the page
   exactly as it was: the Refresh button still works and nothing reports an error. That
   degradation is S-014's requirement, not a nicety. */
function live() {
  if (!window.EventSource) { return; }
  var source = new EventSource("/api/events");
  source.addEventListener("open", function (message) {
    try {
      STATE.pollSeconds = JSON.parse(message.data).poll_seconds;
    } catch (err) { STATE.pollSeconds = null; }
    STATE.live = true;
    renderFootnote();
  });
  source.addEventListener("change", function () {
    /* A hint to look, never a datum: the event says something appeared and the report is
       then read from the store as it always is. Nothing here adds to a figure. */
    renderReport();
    renderFootnote();
  });
  source.onerror = function () {
    STATE.live = false;
    renderFootnote();
  };
}

function renderFootnote() {
  var delay = STATE.pollSeconds === null ? "" :
    " Newly appended records reach an open report within about "
    + STATE.pollSeconds + (STATE.pollSeconds === 1 ? " second" : " seconds")
    + ", whether or not the optional event source is running.";
  document.getElementById("footnote").textContent =
    "Local only, bound to the loopback interface, and read only: this surface changes nothing "
    + "the harness owns and offers no session action. "
    + (STATE.live ? "Following the corpus live." : "Not following: press Refresh to update.")
    + delay + " Store: " + STATE.store;
}

function boot() {
  get("/api/meta").then(function (meta) {
    STATE.reports = meta.reports || [];
    STATE.actions = meta.actions || [];
    STATE.current = (STATE.reports[0] || {}).id || "";
    STATE.store = meta.store || "";
    var scope = document.getElementById("scope");
    (meta.projects || []).forEach(function (project) {
      scope.appendChild(el("option", { value: project, text: project }));
    });
    scope.addEventListener("change", function () {
      STATE.project = scope.value;
      renderReport();
    });
    document.getElementById("refresh").addEventListener("click", renderReport);
    renderNav();
    renderReport();
    renderFootnote();
    live();
  }).catch(function (err) {
    document.getElementById("report").textContent = "Could not reach the local server: " + err;
  });
}

boot();
</script>
</body>
</html>
