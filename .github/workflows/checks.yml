name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No dependency install step: the kit is standard library only, by design.
      # If this workflow ever needs one, that is a signal to reconsider the change
      # rather than to add the step.

      - name: Lint skills
        shell: bash
        run: python scripts/validate-skills.py

      - name: Run the test suite
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate the work-tracking backlog
        shell: bash
        run: python .tasks/validate.py --strict

      - name: Preview adapter generation
        shell: bash
        run: python scripts/build-adapters.py --dry-run

      - name: Preview installation
        shell: bash
        run: python scripts/install.py --dry-run --home ./.tmp/zen-home

      # Exercises the real install path, including POSIX symlink mode, which the
      # dry run does not cover. Re-running proves idempotence, and the uninstall
      # proves the manifest can find what it created.
      #
      # Safe here only because a CI runner starts with no manifest and no prior
      # installation. Do NOT copy this sequence to a development machine: until
      # bug-0003 is fixed, `--uninstall` ignores `--home` and removes every target
      # the manifest records, which includes any real installation you already had.
      - name: Install, re-install, and uninstall against a throwaway home
        shell: bash
        run: |
          python scripts/install.py --home ./.tmp/zen-home
          python scripts/install.py --home ./.tmp/zen-home
          python scripts/install.py --uninstall --home ./.tmp/zen-home

      - name: Check that every relative link in the docs resolves
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys

          docs = ["README.md", "AGENTS.md", "CONTRIBUTING.md", "SECURITY.md",
                  "ROADMAP.md", "CHANGELOG.md"]
          docs += [str(p) for p in pathlib.Path("docs").rglob("*.md")]

          broken = []
          for doc in docs:
              path = pathlib.Path(doc)
              if not path.exists():
                  continue
              for match in re.finditer(r"\[[^\]]*\]\(([^)]+)\)", path.read_text(encoding="utf-8")):
                  target = match.group(1).split("#")[0].strip()
                  if not target or target.startswith(("http://", "https://", "mailto:")):
                      continue
                  if not (path.parent / target).exists():
                      broken.append(f"{doc} -> {target}")

          for entry in broken:
              print(f"broken link: {entry}")
          print(f"checked {len(docs)} documents, {len(broken)} broken link(s)")
          sys.exit(1 if broken else 0)
          PY
