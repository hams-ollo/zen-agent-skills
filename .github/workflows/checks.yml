name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Brackets the supported range: the declared floor and the newest release.
        # 3.9 was dropped by bug-0004 (end-of-life upstream, and re-install was not
        # idempotent on it under Windows). The floor is 3.11 so it stays supported
        # upstream into late 2027, rather than ageing out within months. The upper
        # bound is the version the maintainer actually develops on, so the daily
        # environment is not the one thing nothing tests. Keep the lower bound
        # identical to README's claim.
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No dependency install step: the kit is standard library only, by design.
      # If this workflow ever needs one, that is a signal to reconsider the change
      # rather than to add the step.

      - name: Lint skills
        shell: bash
        run: python scripts/validate-skills.py

      - name: Run the test suite
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate the work-tracking backlog
        shell: bash
        run: python .tasks/validate.py --strict

      - name: Preview adapter generation
        shell: bash
        run: python scripts/build-adapters.py --dry-run

      - name: Preview installation
        shell: bash
        run: python scripts/install.py --dry-run --home ./.tmp/zen-home

      # Exercises the real install path, including POSIX symlink mode, which the
      # dry run does not cover. Re-running proves idempotence, and the uninstall
      # proves the manifest can find what it created.
      #
      # Safe on a development machine too, since bug-0003: `--uninstall` is scoped
      # to `--home`, so reversing a throwaway home leaves a real installation alone
      # (S-012). Before that fix this sequence destroyed it.
      - name: Install, re-install, and uninstall against a throwaway home
        shell: bash
        run: |
          python scripts/install.py --home ./.tmp/zen-home
          python scripts/install.py --home ./.tmp/zen-home
          python scripts/install.py --uninstall --home ./.tmp/zen-home

      - name: Check that every relative link in the docs resolves
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, sys

          # Globbed rather than listed. The list was six hardcoded names, so every
          # new root-level document silently fell outside the check until someone
          # remembered to add it, which is the failure mode this step exists to
          # catch. chore-0018 and chore-0019 each landed a document the list missed.
          docs = [str(p) for p in sorted(pathlib.Path(".").glob("*.md"))]
          docs += [str(p) for p in sorted(pathlib.Path(".github").rglob("*.md"))]
          docs += [str(p) for p in sorted(pathlib.Path("docs").rglob("*.md"))]

          broken = []
          for doc in docs:
              path = pathlib.Path(doc)
              if not path.exists():
                  continue
              for match in re.finditer(r"\[[^\]]*\]\(([^)]+)\)", path.read_text(encoding="utf-8")):
                  target = match.group(1).split("#")[0].strip()
                  # Kept in step with LINK_SKIP_PREFIXES in .tasks/validate.py. An
                  # absolute `file:` link names a location on someone's disk, so it
                  # is not this step's to resolve.
                  if not target or target.startswith(("http://", "https://", "mailto:", "file://")):
                      continue
                  if not (path.parent / target).exists():
                      broken.append(f"{doc} -> {target}")

          for entry in broken:
              print(f"broken link: {entry}")
          print(f"checked {len(docs)} documents, {len(broken)} broken link(s)")
          sys.exit(1 if broken else 0)
          PY
