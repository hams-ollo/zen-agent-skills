name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Brackets the supported range: the declared floor and the newest release.
        # 3.9 was dropped by bug-0004 (end-of-life upstream, and re-install was not
        # idempotent on it under Windows). The floor is 3.11 so it stays supported
        # upstream into late 2027, rather than ageing out within months. The upper
        # bound is the version the maintainer actually develops on, so the daily
        # environment is not the one thing nothing tests. Keep the lower bound
        # identical to README's claim.
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No dependency install step: the kit is standard library only, by design.
      # If this workflow ever needs one, that is a signal to reconsider the change
      # rather than to add the step.

      - name: Lint skills
        shell: bash
        run: python scripts/validate-skills.py

      - name: Run the test suite
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate the work-tracking backlog
        shell: bash
        run: python .tasks/validate.py --strict

      - name: Preview adapter generation
        shell: bash
        run: python scripts/build-adapters.py --dry-run

      - name: Preview installation
        shell: bash
        run: python scripts/install.py --dry-run --home ./.tmp/zen-home

      # Exercises the real install path, including POSIX symlink mode, which the
      # dry run does not cover. Re-running proves idempotence, and the uninstall
      # proves the manifest can find what it created.
      #
      # Safe on a development machine too, since bug-0003: `--uninstall` is scoped
      # to `--home`, so reversing a throwaway home leaves a real installation alone
      # (S-012). Before that fix this sequence destroyed it.
      - name: Install, re-install, and uninstall against a throwaway home
        shell: bash
        run: |
          python scripts/install.py --home ./.tmp/zen-home
          python scripts/install.py --home ./.tmp/zen-home
          python scripts/install.py --uninstall --home ./.tmp/zen-home

      # Calls the link rule in .tasks/validate.py rather than restating it. This step
      # used to carry its own inline copy, which drifted: bug-0015 taught the validator
      # that a link inside a code span is not a link, this copy never learned it, and a
      # correctly quoted example in CHANGELOG.md passed `--strict` and failed here
      # (chore-0029). One rule, two callers, and the two file sets stay disjoint on
      # purpose: the validator walks .tasks/, and this walks the documents around it.
      # Wave 2's closeout broke three links here that `--strict` passed clean over.
      #
      # Globbed rather than listed. The list was six hardcoded names, so every new
      # root-level document silently fell outside the check until someone remembered to
      # add it, which is the failure mode this step exists to catch. chore-0018 and
      # chore-0019 each landed a document the list missed.
      #
      # `--links` fails on an empty match as well as on a broken link, so this step
      # cannot pass by checking nothing at all. Note the bound: the guard fires when
      # *every* pattern matches nothing, not when one of three does. Rename docs/ and
      # this step still passes, having checked 9 documents of 38. Closing that needs a
      # per-pattern assertion, filed rather than bolted on here (chore-0029).
      #
      # No `shell: bash`: calling a checked-in script instead of a heredoc drops this
      # step's dependency on bash being present on the Windows runner.
      - name: Check that every relative link in the docs resolves
        run: python .tasks/validate.py --links "*.md" ".github/**/*.md" "docs/**/*.md"
