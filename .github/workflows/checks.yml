name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Brackets the supported range: the declared floor and the newest release.
        # 3.9 was dropped by bug-0004 (end-of-life upstream, and re-install was not
        # idempotent on it under Windows). The floor is 3.11 so it stays supported
        # upstream into late 2027, rather than ageing out within months. The upper
        # bound is the version the maintainer actually develops on, so the daily
        # environment is not the one thing nothing tests. Keep the lower bound
        # identical to README's claim.
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No dependency install step: the kit is standard library only, by design.
      # If this workflow ever needs one, that is a signal to reconsider the change
      # rather than to add the step.

      # One step, every gate. This used to be one step per gate, each naming its own
      # command, which meant the gate set existed only here and nothing outside CI
      # could run it. An agent working unattended cannot push and wait for someone to
      # read this page, so the gates moved into a committed script and this step calls
      # it (feat-0045, docs/spec/cloud-executable.md S-005).
      #
      # One rule, two callers. That is the same shape chore-0029 established for the
      # link rule after an inline copy of it drifted, taught nothing by bug-0015, and
      # let a correctly quoted CHANGELOG.md entry pass `--strict` and fail here.
      # Restating any gate below would recreate exactly that divergence, and
      # tests/test_run_checks.py asserts that none is restated.
      #
      # What the script covers, and why each is here, is documented at its own gate
      # table rather than duplicated in this comment.
      #
      # Still safe on a development machine, since bug-0003: `--uninstall` is scoped to
      # `--home`, so reversing the throwaway home leaves a real installation alone
      # (install.md S-012). The script also reverses that home even when the gate fails
      # partway, which the seven-step version could not do.
      #
      # No `shell: bash`: calling a checked-in script instead of a heredoc drops this
      # step's dependency on bash being present on the Windows runner.
      - name: Run every acceptance gate
        run: python scripts/run-checks.py
